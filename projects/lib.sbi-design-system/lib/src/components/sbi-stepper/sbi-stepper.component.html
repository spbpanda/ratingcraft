@if (stepperService.steps().length) {
    <div class="sbi-stepper">
        @for (step of stepperService.steps(); track $index) {
            <div
                class="sbi-step" 
                [ngClass]="{ 
                    'active': step.state === 'active',
                    'disabled': step.state === 'disabled',
                    'completed': step.state === 'visited' || step.state === 'completed', 
                    'active-cursor': isStepClickable
                }"
                (click)="isStepClickable && step.state != 'disabled' ? goTo(step) : null"
            >
            <div class="sbi-step__circle-wrapper">
                <div class="sbi-step__circle">
                    @if (step.state === 'completed') {
                        <sbi-icon [iconImage]="checkMark"></sbi-icon>
                    } @else {
                        <span class="sbi-step__circle_number">{{ step.number }}</span>
                    }
                </div>
            </div>
                <div class="sbi-step__name">{{ step.name }}</div>
            </div>
        }
    </div>
}
