<mat-form-field
    class="sbi-textarea"
    [ngClass]="{ 'sbi-textarea_disabled': readonly }"
    appearance="fill"
>
    <div class="textarea-container">
        <textarea
            [formControl]="control"
            matInput
            [readonly]="readonly"
            [placeholder]="placeholder"
            cdkTextareaAutosize
            #autosize="cdkTextareaAutosize"
            [cdkAutosizeMinRows]="1"
            [cdkAutosizeMaxRows]="null"
            [maxlength]="maxLength"
            [id]="testId"
        >
        </textarea>
        <div class="counter" *ngIf="maxLength">{{control.value?.length || 0}} / {{ maxLength }}</div>
    </div>
    <!-- <div
        *ngIf="control.value && !control.disabled && suffixIconType === 'clear' && !readonly"
        (click)="clearControl()"
        class="close-icon"
        matSuffix>
    </div> -->
</mat-form-field>

<sbi-error *ngIf="control.invalid && control.touched" [errors]="control.errors" [errorMessages]="errorMessages"></sbi-error>
