<mat-radio-group class="sbi-radio" [formControl]="control" color="primary" [attr.data-testid]="testId">
  <mat-radio-button *ngFor="let option of options" [value]="option.value" class="sbi-radio-content" [disabled]="option.disabled">
    <div
    *ngIf="option.label"
    class="sbi-radio-label"
    [ngClass]="{ link: option.isLink }" (click)="option.isLink && onClickToLink()"
    [attr.data-testid]="testId + '-radio-label'">
      <div>{{ option.label }}</div>
    <div *ngIf="option.note" class="note">{{ option.note }}</div>
  </div>
  </mat-radio-button>
</mat-radio-group>
