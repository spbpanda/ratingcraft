<mat-button-toggle-group
  class="sbi-button-toggle-group"
  [value]="control.value"
  [ngClass]="{
    'size-large': size === ToggleButtonSizeEnum.large,
    'size-small': size === ToggleButtonSizeEnum.small,
    'size-mini': size === ToggleButtonSizeEnum.mini,
    'vertical': isVertical,
  }"
  [attr.data-testid]="testId">
  <mat-button-toggle
    *ngFor="let button of buttons"
    [disabled]="control.disabled || !!button.disabled"
    [value]="button"
    [checked]="buttonToggleIsChecked(button.value)"
    [attr.data-testid]="testId + '-' + button.label"
    (change)="onButtonChange(button)">
    {{ button.label }}
  </mat-button-toggle>
</mat-button-toggle-group>
