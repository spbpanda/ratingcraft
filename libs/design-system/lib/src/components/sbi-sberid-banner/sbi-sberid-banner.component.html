<div class="banner-wrapper">
  <div class="banner-container">
    <span class="banner-container__label">{{ label }}</span>
    <p class="banner-container__note">{{ note }}</p>
    <!--    todo: Заменить content на кнопку сбер ид-->
    @if (!isMobile) {
    <ng-content select="sber-id"></ng-content>
    }
  </div>
  <sbi-icon class="heart-hand" [iconImage]="rightIcon"></sbi-icon>
  <sbi-icon class="close" [iconImage]="clearIcon" (click)="onClearBanner()"></sbi-icon>

  <div class="click-target" (click)="onSberidAuth()"></div>
</div>
