<mat-toolbar class="rc-toolbar">
    <button mat-icon-button aria-label="Example icon-button with menu icon">
        <mat-icon>menu</mat-icon>
    </button>
    <span>RatingCraft</span>
    <span class="spacer"></span>
    <sbi-dark-slider></sbi-dark-slider>

    @if (authService.isUserLoggedIn() && user) {
        <div>{{user.name}}</div>
    } @else {
        <sbi-button appearance="primary-tint" (click)="openLoginDialog()">Войти<mat-icon>person</mat-icon></sbi-button>
    }
      
</mat-toolbar>
