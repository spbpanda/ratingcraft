<mat-toolbar class="rc-toolbar">
    <a href="/" class="logo">
        <span class="logo-name1">RATING</span>
        <span class="logo-name2">CRAFT</span>
    </a>
    <span class="spacer"></span>
    <sbi-dark-slider></sbi-dark-slider>

    @if (authService.isUserLoggedIn() && user) {
        <sbi-button appearance="overlay" [matMenuTriggerFor]="menu">{{user.name}}<sbi-icon [iconImage]="arrow_down"></sbi-icon></sbi-button>
    } @else {
        <sbi-button appearance="primary-tint" (click)="openLoginDialog()">Войти</sbi-button>
    }
      
</mat-toolbar>

<mat-menu #menu="matMenu">
    <a mat-menu-item routerLink="user/payments" routerLinkActive="active">Платежи</a>
    <a mat-menu-item routerLink="add-server" routerLinkActive="active">Добавить сервер</a>
    <a mat-menu-item routerLink="user/my-servers" routerLinkActive="active">Мои сервера</a>
    <a mat-menu-item routerLink="user/favorite-servers" routerLinkActive="active">Любимые сервера</a>
    <button mat-menu-item (click)="logout()">Выйти из аккаунта</button>
</mat-menu>
