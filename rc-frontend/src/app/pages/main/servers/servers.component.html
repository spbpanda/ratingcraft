<h2>Мониторинг серверов Minecraft</h2>
@for (server of servers(); track $index) {
    <rc-server-banner [server]="server" [index]="$index"></rc-server-banner>
}
<mat-paginator
    [length]="paginatorBack().total"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="[10, 50, 100]"
    (page)="onPageChange($event)"
    >
</mat-paginator>
