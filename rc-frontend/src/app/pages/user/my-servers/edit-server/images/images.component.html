<div class="screenshots-container">
  <div class="upload-section">
    @if (images.length < maxImages) {
      <div class="container">
        <label class="btn" for="screenshot-upload">Загрузить изображение</label>
      </div>
    }
    <input id="screenshot-upload" type="file" accept="image/*" (change)="onFileSelected($event)" hidden multiple>
  </div>

  <div class="screenshots-preview">
    @for (image of images; track image; let i = $index) {
      <div class="screenshot">
        <div class="screenshot-image">
          <img [src]="image" alt="Скриншот {{i + 1}}">
        </div>
        <sbi-icon-button [icon]="trashBin" appearance="warn" (click)="removeImage(i)"></sbi-icon-button>
      </div>
    }
  </div>
</div>
