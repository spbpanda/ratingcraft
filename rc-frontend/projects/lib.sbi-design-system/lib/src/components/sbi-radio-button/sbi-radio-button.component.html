<mat-radio-button
  [value]="value"
  class="sbi-radio-content"
  (click)="$event.stopPropagation()"
  [disabled]="disabled">
  <div
    class="sbi-radio-label"
    [ngClass]="{ link: isLink, 'margin-label': !!label || !!note }"
    (click)="$event.stopPropagation(); $event.preventDefault(); onClickToLink();"
    [attr.data-testid]="testId + '-radio-label'">
    @if (label || note) {
      <div *ngIf="label" class="label">{{ label }}</div>
      <div *ngIf="note" class="note">{{ note }}</div>
    } @else {
      <ng-container *ngTemplateOutlet="customContent ?? null"></ng-container>
    }
  </div>
</mat-radio-button>
