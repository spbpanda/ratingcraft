<mat-radio-group class="sbi-radio" [formControl]="control" color="primary" [attr.data-testid]="testId">
  <mat-radio-button
    *ngFor="let option of options; let idx = index"
    [value]="option.value"
    class="sbi-radio-content"
    [disabled]="option.disabled">
    <div
      class="sbi-radio-label"
      [ngClass]="{ link: option.isLink }"
      (click)="onClickToLink(option)"
      [attr.data-testid]="testId + '-radio-label'">
      @if (option.label || option.note) {
        <div *ngIf="option.label" class="label">{{ option.label }}</div>
        <div *ngIf="option.note" class="note">{{ option.note }}</div>
      } @else {
        <ng-container *ngTemplateOutlet="option.customContent ?? null"></ng-container>
      }
    </div>
  </mat-radio-button>
</mat-radio-group>
