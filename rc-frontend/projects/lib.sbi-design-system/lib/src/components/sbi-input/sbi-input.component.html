<mat-form-field
  appearance="fill"
  class="sbi-input"
  [attr.data-testid]="testId"
  [hideRequiredMarker]="hideRequiredMarker"
>
  <span matPrefix *ngIf="prefixIconType === 'custom'">
    <ng-content select="[prefix-icon]"></ng-content>
  </span>
  <span matPrefix *ngIf="prefixIconType === 'search'">
    <sbi-icon size="24" color="primary" [iconImage]="searchIcon"></sbi-icon>
  </span>
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    sbiInputUppercase
    sbiNameUppercase
    sbiMultiUppercase
    sbiTitleCase
    sbiInputMode
    [attr.data-testid]="testId + '-input'"
    [type]="type"
    [min]="min"
    [max]="max"
    [formControl]="control"
    [mask]="ngxMask"
    [suffix]="ngxSuffix"
    [prefix]="ngxPrefix"
    [patterns]="ngxPattern"
    [separatorLimit]="ngxSeparatorLimit"
    [thousandSeparator]="ngxThousandSeparator"
    [dropSpecialCharacters]="dropSpecialCharacters"
    [maxlength]="maxLength"
    [minlength]="minLength"
    [inputMode]="inputMode"
    [inputUppercaseActive]="inputUppercaseActive"
    [inputNameUppercaseActive]="inputNameUppercaseActive"
    [inputMultiUppercaseActive]="inputMultiUppercaseActive"
    [inputTitleCaseActive]="inputTitleCaseActive"
    [readonly]="readonly"
    [placeholder]="placeholder"
    [autofocus]="autofocus"
    (focusin)="onFocusChange(true)"
    (focusout)="onFocusChange(false)"
    (input)="onInputChange($event)"
  />
  <div
    class="clear-icon"
    matSuffix
    *ngIf="suffixIconType === 'clear' && !readonly && !!control.value && focused() && control.enabled"
    [attr.data-testid]="testId + '-clear-icon'"
    [class.invalid]="control.touched && control.invalid"
    [class.focused]="control.valid && focused()"
    (mousedown)="onClearControl($event)"
    (tap)="onClearControl($event)"
  >
    <sbi-icon [iconImage]="clearIcon"></sbi-icon>
  </div>

  <span *ngIf="suffixIconType === 'custom'" matSuffix>
    <ng-content select="[suffix-icon]"></ng-content>
  </span>
  <div matSuffix class="suffix-content">
    <ng-content select="[suffix-content]"></ng-content>
  </div>
</mat-form-field>

@if (control.invalid && control.touched && showErrors) {
  <sbi-error
    [testId]="testId + '-error-message'"
    [errors]="control.errors"
    [errorMessages]="errorMessages"
  ></sbi-error>
} @else {
  <div
    *ngIf="subtitle !== undefined"
    class="subtitle"
    [class.disabled]="control.disabled"
    [attr.data-testid]="testId + '-subtitle-message'"
  >
    {{ subtitle }}
  </div>
}
