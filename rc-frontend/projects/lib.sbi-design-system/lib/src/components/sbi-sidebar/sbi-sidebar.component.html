<div class="sticky-container">
  <div class="sbi-sidebar-main-info" *ngIf="showBeforeMainInfo">
    <ng-content select="before-main-info"></ng-content>
  </div>

  <div class="sbi-sidebar-main-info" *ngIf="showMainInfo">
    <ng-content select="main-info"></ng-content>
  </div>

  <div class="sbi-sidebar-main-info" *ngIf="showAfterMainInfo">
    <ng-content select="after-main-info"></ng-content>
  </div>

  <div class="sbi-sidebar-container" *ngIf="!!priceLabel">
    <div class="sber-grad-wrapper">
      <div class="sber-grad"></div>
    </div>
    <div class="sbi-sidebar-container__label-wrapper">
      <span class="sbi-sidebar-container__label">{{ priceLabel }}</span>
    </div>
    <ng-content select="price-info"></ng-content>
  </div>

  <div class="sbi-sidebar-main-info" *ngIf="showAfterPriceInfo">
    <ng-content select="after-price-info"></ng-content>
  </div>

  <div class="sbi-sidebar-container" *ngIf="showPromo || showDocs">
    <div class="sbi-sidebar-container__actions-wrapper">
      <div class="sbi-sidebar-container__label" *ngIf="showPromo" (click)="onPromoClick($event)">{{ promoLabel }}</div>
      <div class="sbi-sidebar-container__label" *ngIf="showDocs" (click)="onDocsClick($event)">{{ docsLabel }}</div>
    </div>
  </div>

  <div class="sbi-sidebar-main-info" *ngIf="showAfterDocsAndPromoInfo">
    <ng-content select="after-docs-and-promo-info"></ng-content>
  </div>
</div>
