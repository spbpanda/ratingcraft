<div class="sbi-questions-container" [attr.data-testid]="testId">
  <sbi-optional-card
    *ngFor="let question of questions; let i = index"
    type="checkbox"
    [value]="false"
    [label]="question.label"
    [note]="question.note"
    [showInfoIcon]="false"
    [testId]="testId + 'question-' + i"
    (valueChanged)="onSelectedFeedbackQuestions(question)"></sbi-optional-card>
  <sbi-textarea *ngIf="showComment" label="Коментарий" placeholder="Коментарий" [control]="comment"></sbi-textarea>
</div>
