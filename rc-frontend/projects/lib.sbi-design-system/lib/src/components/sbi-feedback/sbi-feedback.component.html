<div class="sbi-feedback-container">
  <div class="sbi-feedback-content">
    @if (step === 'points') {
      <ng-content select="points-content"></ng-content>
    }
    @if (step === 'questions') {
      <ng-content select="questions-content"></ng-content>
    }
    @if (step === 'custom') {
      <ng-content select="custom-content"></ng-content>
    }
    <sbi-feedback-points
      *ngIf="step === 'points'"
      [pointsCount]="pointsCount"
      [activePoint]="selectedPoints"
      [label]="pointsLabel"
      [testId]="testId + '-points'"
      (selectPoints)="selectedPoints.set($event)"></sbi-feedback-points>
    <sbi-feedback-questions
      *ngIf="step === 'questions'"
      [selectedQuestions]="selectedQuestions()"
      [comment]="comment()"
      [questions]="questions"
      [testId]="testId + 'question'"
      (changeComment)="comment.set($event)"
      (changeSelectedFeedbackQuestions)="selectedQuestions.set($event)"></sbi-feedback-questions>
  </div>
  <div class="sbi-feedback-button-container">
    <sbi-button
      *ngIf="primaryButtonLabel"
      [disabled]="disabled()"
      class="button"
      size="large"
      appearance="primary"
      (click)="onPrimaryButtonClick()">
      {{ primaryButtonLabel }}
    </sbi-button>
    <sbi-button
      *ngIf="secondaryButtonLabel"
      class="button"
      size="large"
      appearance="primary-tint"
      (click)="onSecondaryButtonClick()">
      {{ secondaryButtonLabel }}
    </sbi-button>
  </div>
</div>
