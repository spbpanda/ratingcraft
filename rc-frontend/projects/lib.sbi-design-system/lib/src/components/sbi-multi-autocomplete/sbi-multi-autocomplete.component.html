<mat-form-field
  appearance="fill"
  class="sbi-autocomplete sbi-input"
  [ngClass]="{ 'mat-form-field-invalid': formFieldInvalid(), 'mat-form-field-disabled': disabled }"
  [attr.data-testid]="testId"
  (click)="activeInput()"
  (blur)="formFieldBlur()"
  [hideRequiredMarker]="hideRequiredMarker">
  <span matPrefix *ngIf="prefixIconType === 'custom'">
    <ng-content select="[prefix-icon]"></ng-content>
  </span>
  <div class="sbi-multi-autocomplete-block" #autocompleteInput>
    <input [disabled]="disabled" hidden matInput>
    <ng-container *ngFor="let elem of elements; let idx = index">
      <sbi-chip
        *ngIf="!elem.visible && !!elem.control.value"
        [ngClass]="{ 'ml-4': idx }"
        [invalid]="invalid || formFieldInvalid()"
        [label]="(elem.displayFn ?? baseDisplayFn)(elem.control.value)"
        [disabled]="disabled"
        [testId]="testId + '-' + elem.fieldName + '-chip'"
        (click)="$event.stopPropagation()"
        (clearChipEvent)="removeElementValue(elem, idx); $event.stopPropagation()"></sbi-chip>
      <input
        *ngIf="elem.visible && !hiddenControlNames.includes(elem.fieldName)"
        style="width: {{elem.width ?? 150}}px; min-width: {{elem.width ?? 150}}px;"
        class="sbi-autocomplete-input"
        matInput
        sbiInputUppercase
        sbiTitleCase
        sbiInputMode
        [id]="elem.fieldName"
        [ngClass]="{ 'ml-4': idx }"
        [type]="elem.inputType ?? 'text'"
        [inputMode]="elem.inputMode ?? 'text'"
        [maxlength]="elem.maxLength ?? null"
        [readonly]="readonly"
        [inputUppercaseActive]="!!elem.inputUppercaseActive"
        [placeholder]="elem.placeholder ?? ''"
        [inputTitleCaseActive]="!!elem.inputTitleCaseActive"
        [formControl]="elem.control"
        [maskito]="elem.maskitoMask ?? baseMaskitoMask"
        [matAutocomplete]="elem.controlType === 'input' ? empty : auto"
        [attr.data-testid]="testId + '-' + elem.controlType + '-' + elem.fieldName"
        (focusin)="onFocusChange(true)"
        (focusout)="onFocusChange(false)"
        (blur)="onBlur(elem)"
        (tap)="setActiveElement(elem); $event.stopPropagation()"
        (click)="setActiveElement(elem); $event.stopPropagation()"/>
    </ng-container>
  </div>
  <div class="icon-container" matSuffix>
    <div
      *ngIf="suffixIconType === 'clear' && !disabled && focused() && !readonly"
      class="clear-icon"
      [class.invalid]="activeElement?.control?.touched && activeElement?.control?.invalid"
      [class.focused]="focused()"
      [attr.data-testid]="testId + '-clear-icon'"
      (mousedown)="onClearControl(); $event.stopPropagation()"
      (tap)="onClearControl(); $event.stopPropagation()">
      <sbi-icon [iconImage]="clearIcon"></sbi-icon>
    </div>

    <div
      class="chevron-icon"
      [class.open]="activeElement && activeElement.controlType === 'autocomplete' && focused()"
      [class.disabled]="disabled"
      [class.focused]="activeElement && activeElement.control.valid && focused()">
      <sbi-icon [iconImage]="chevronIcon"></sbi-icon>
    </div>

    <span *ngIf="suffixIconType === 'custom'">
      <ng-content select="[suffix-icon]"></ng-content>
    </span>
  </div>

  <div matSuffix class="suffix-content">
    <ng-content select="[suffix-content]" >
    </ng-content>
  </div>

  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="activeElement?.displayFn ?? baseDisplayFn"
    [attr.data-testid]="testId + '-autocomplete'"
    (optionSelected)="onSelectionChange($event)">
    <div class="sbi-options">
      <mat-option
        *ngFor="let option of filteredOptions$ | async; trackBy: trackByFn"
        class="sbi-autocomplete-option"
        [attr.data-testid]="testId + '-option-' + option.viewValue"
        [value]="option.value">
        {{ option.viewValue }}
      </mat-option>
    </div>
  </mat-autocomplete>
  <mat-autocomplete #empty="matAutocomplete"></mat-autocomplete>
</mat-form-field>

@if(formFieldInvalid()) {
  <sbi-error [testId]="testId + '-error-message'" [errors]="errors" [errorMessages]="errorMessages"></sbi-error>
} @else {
  <div
    *ngIf="subtitle !== undefined"
    class="subtitle"
    [class.disabled]="disabled"
    [attr.data-testid]="testId + '-subtitle-message'">
    {{ subtitle }}
  </div>
}
