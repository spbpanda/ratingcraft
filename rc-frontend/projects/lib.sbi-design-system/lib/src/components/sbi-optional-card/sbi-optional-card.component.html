<div
  class="sbi-card-badge"
  [class]="{ static: static, 'large': size === 'large', 'small': size === 'small' }"
  [attr.data-testid]="testId">
  @if (!!badgeContent) {
    <sbi-badge
      class="sbi-card-badge-container"
      [type]="badgeType"
      [size]="size === 'small' ? size : badgeSize"
      [content]="badgeContent"></sbi-badge>
  }
  <div class="sbi-card-container" #cardContainer (click)="onCardClick()">
    <ng-template [ngTemplateOutlet]="activeElement"></ng-template>
    <div class="sbi-card-container__label-wrapper">
      @if (label) {
        <div class="sbi-card-container__label-wrapper__label">{{ label }}</div>
      }
      @if (note) {
        <div
          class="sbi-card-container__label-wrapper__note"
          [ngClass]="{ link: isLink }"
          (click)="isLink && onLinkClick(); $event.preventDefault(); $event.stopPropagation()">
          {{ note }}
        </div>
      }
    </div>
    @if (showInfoIcon) {
      <sbi-icon
        size="24"
        [sbiTooltip]="tooltipContent"
        [tooltipPosition]="tooltipPosition"
        [iconImage]="questionIcon"
        [testId]="testId + '-question-icon'"></sbi-icon>
    }
    @if ((type === 'icons' || type === 'illustration') && showCheckbox) {
      <sbi-checkbox
        class="checkbox"
        [control]="control"
        [testId]="testId + '-checkbox'"
        (click)="$event.stopPropagation()"
        (valueChanged)="onClick()"></sbi-checkbox>
    }
    <ng-content select="[active-actions]"></ng-content>
  </div>
</div>

<ng-template #activeElement>
  <ng-container [ngSwitch]="type">
    <sbi-checkbox
      *ngSwitchCase="'checkbox'"
      class="checkbox"
      [control]="control"
      [testId]="testId + '-checkbox'"
      (click)="$event.stopPropagation()"
      (valueChanged)="onClick()"></sbi-checkbox>
    <sbi-radio-button
      *ngSwitchCase="'radio'"
      class="radio"
      [value]="value"
      [testId]="testId + '-radio'"
      (click)="$event.stopPropagation()"></sbi-radio-button>
    <sbi-slide-toggle
      *ngSwitchCase="'switch'"
      class="toggle"
      [control]="control"
      [testId]="testId + '-switch'"
      (click)="$event.stopPropagation()"
      (valueChanged)="onClick()"></sbi-slide-toggle>
    <sbi-icon
      *ngSwitchCase="'icons'"
      class="icon"
      [color]="iconColor"
      [iconImage]="icon"
      [testId]="testId + '-icons'"></sbi-icon>
    @if (!!illustrationIcon) {
      <sbi-icon
        *ngSwitchCase="'illustration'"
        class="illustration"
        [iconImage]="illustrationIcon"
        [testId]="testId + '-illustration'"></sbi-icon>
    } @else {
      <ng-container *ngSwitchCase="'illustration'">
        <ng-content select="illustration-content"></ng-content>
      </ng-container>
    }
  </ng-container>
</ng-template>
