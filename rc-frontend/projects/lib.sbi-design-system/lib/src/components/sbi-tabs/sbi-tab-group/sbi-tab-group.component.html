<mat-tab-group class="sbi-tab-group" [ngClass]="'align-' + alignTabs">
  <ng-container *ngIf="tabsArray && tabsArray.length > 0; else loading">
    <mat-tab
      *ngFor="let tab of tabsArray; trackBy: trackByIndex"
      #matTab
      [disabled]="tab.disabled"
      [id]="tab.testId"
    >
      <ng-template mat-tab-label>
        <ng-container
          *ngIf="tab?.customLabel; else defaultLabel"
          [ngTemplateOutlet]="tab.customLabel"
        ></ng-container>
        <ng-template #defaultLabel>
          <span class="sbi-tab sbi-tab--{{tab.size}} sbi-tab--{{tab.appearance}} {{matTab.isActive ? '' : 'sbi-tab--inactive'}}">
            {{ tab.label }}
          </span>
        </ng-template>
      </ng-template>
      <ng-container *ngIf="tab?.templateRef">
        <ng-container *ngTemplateOutlet="tab.templateRef"></ng-container>
      </ng-container>      
    </mat-tab>
  </ng-container>
  <ng-template #loading>Загрузка вкладок...</ng-template>
</mat-tab-group>
