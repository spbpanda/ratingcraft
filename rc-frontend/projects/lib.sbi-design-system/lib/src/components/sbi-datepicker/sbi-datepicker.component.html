<mat-form-field appearance="fill" class="sbi-input" [attr.data-testid]="testId" [hideRequiredMarker]="hideRequiredMarker">
  <mat-label>{{ label }}</mat-label>
  <div class="range-inputs">
    <input
      inputmode="numeric"
      matInput
      [attr.data-testid]="testId + '-input'"
      [formControl]="control"
      [min]="min"
      [max]="max"
      [matDatepicker]="picker"
      [placeholder]="placeholder"
      [readonly]="readonly"
      [sbiMaskDate]="showTimePicker"
      (dateInput)="onDateInputChange($event)"
      (dateChange)="onDateSelectChange($event)"
      (input)="onInputChange($event)"
      (focusin)="onFocusChange(true)"
      (focusout)="onFocusChange(false)" />

    <input
      *ngIf="isRange && endControl"
      inputmode="numeric"
      matInput
      [attr.data-testid]="testId + '-end-input'"
      [formControl]="endControl"
      [matDatepicker]="picker"
      [readonly]="true"
      [placeholder]="'До'"
      [sbiMaskDate]="showTimePicker" />
  </div>

  <mat-datepicker-toggle matSuffix [for]="picker" [attr.data-testid]="testId + '-toggle'">
    <div
      #datePickerToggle
      [class.invalid]="control.touched && control.invalid"
      [class.focused]="focused()"
      [class.disabled]="control.disabled"
      matDatepickerToggleIcon>
      <sbi-icon [iconImage]="calendarIcon"></sbi-icon>
    </div>
  </mat-datepicker-toggle>

  <mat-datepicker
    #picker
    [attr.data-testid]="testId + '-datepicker'"
    [calendarHeaderComponent]="DatepickerHeaderComponent"
    [dateClass]="dateClass"
    (viewChanged)="onViewChanged()"
    (opened)="onOpened()"
    (closed)="onClosed()"
    (click)="onCalendarClick($event)"
    (mouseover)="onCalendarHover($event)"
    panelClass="sbi-calendar">
    <mat-datepicker-actions *ngIf="showDatePickerButtons" [attr.data-testid]="testId + '-actions'">
      <sbi-button
        (click)="onCancel()"
        [size]="'small'"
        [appearance]="'primary-tint'"
        matDatepickerCancel
      >{{ cancelButtonText }}</sbi-button>
      <sbi-button
        (click)="onApply()"
        [size]="'small'"
        matDatepickerApply
      >{{ applyButtonText }}</sbi-button>
    </mat-datepicker-actions>
  </mat-datepicker>
</mat-form-field>

<!-- todo: Мб вынести в отдельный компонент?-->
@if(control.invalid && control.touched) {
<sbi-error [testId]="testId + '-error-message'" [errors]="control.errors" [errorMessages]="errorMessages"></sbi-error>
} @else {
<div
  *ngIf="subtitle !== undefined"
  class="subtitle"
  [class.disabled]="control.disabled"
  [attr.data-testid]="testId + '-subtitle-message'">
  {{ subtitle }}
</div>
}
