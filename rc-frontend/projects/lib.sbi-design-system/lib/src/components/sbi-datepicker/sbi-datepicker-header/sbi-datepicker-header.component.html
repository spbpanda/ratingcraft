<div class="datepicker-header" [attr.data-testid]="testId">
  <div class="label-wrapper" (click)="changeView()" [attr.data-testid]="testId + '-choose-date'">
    <div class="label">{{ label() }}</div>
    <sbi-icon class="selector-arrow" [iconImage]="selectorArrow"></sbi-icon>
  </div>
  <div class="date-picker-arrows">
    <div
      id="sbi-datepicker-previous-button"
      class="date-picker-arrow-wrapper left-arrow"
      [attr.data-testid]="testId + '-previous-button'"
      (click)="previous()">
      <sbi-icon class="arrow-icon" [iconImage]="arrow"></sbi-icon>
    </div>
    <div
      id="sbi-datepicker-next-button"
      class="date-picker-arrow-wrapper"
      [attr.data-testid]="testId + '-next-button'"
      (click)="next()">
      <sbi-icon class="arrow-icon" [iconImage]="arrow"></sbi-icon>
    </div>
  </div>
</div>
