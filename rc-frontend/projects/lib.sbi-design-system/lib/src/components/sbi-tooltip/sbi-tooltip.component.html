<div class="tooltip-container" [ngClass]="tooltipPosition">
    @if (content) {
        <ng-container *ngTemplateOutlet="content; context: context"></ng-container>
    } @else {
        {{ contentText }}
    }
    <svg width="20" height="8" viewBox="0 0 20 8" fill="none" xmlns="http://www.w3.org/2000/svg" class="tooltip-arrow">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M10 0C13 0 15.9999 8 20 8H0C3.9749 8 7 0 10 0Z" fill="#3B3B3B"/>
    </svg>
</div>
