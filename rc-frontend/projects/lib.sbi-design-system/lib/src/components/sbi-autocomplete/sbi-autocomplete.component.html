<mat-form-field appearance="fill" class="sbi-autocomplete sbi-input" [attr.data-testid]="testId"
                [hideRequiredMarker]="hideRequiredMarker">
  <span matPrefix *ngIf="prefixIconType === 'custom'">
    <ng-content select="[prefix-icon]"></ng-content>
  </span>
  <sbi-chip-row
    #autocompleteChipRow
    [control]="control"
    [displayFn]="displayFunc"
    [testId]="testId + '-chip-row'"
    (removeChipEvent)="removeChip($event)">
    <input
      ngProjectAs="[in-chip-row]"
      class="sbi-autocomplete-input"
      #autocompleteInput
      matInput
      sbiInputUppercase
      sbiTitleCase
      sbiInputMode
      [ngClass]="{ 'ml-4': !!control.value.length }"
      [type]="type"
      [inputMode]="inputMode"
      [maxlength]="maxLength"
      [inputUppercaseActive]="inputUppercaseActive"
      [placeholder]="!control.value.length ? placeholder : ''"
      [inputTitleCaseActive]="inputTitleCaseActive"
      [formControl]="searchControl"
      [maskito]="mask"
      [readonly]="readonly || disabledByMaxElems"
      [matAutocomplete]="auto"
      [attr.data-testid]="testId + '-input'"
      (blur)="onInputBlur($event)"
      (click)="$event.stopPropagation(); scrollToRight()"
      (focusin)="onFocusChange(true); activeInput()"
      (focusout)="onFocusChange(false)"
      (input)="onInputChange($event)"/>
  </sbi-chip-row>
  <div class="icon-container" matSuffix>
    <div
      *ngIf="suffixIconType === 'clear' && (!!control.value.length || !!searchControl.value) && control.enabled && focused() && !readonly"
      class="clear-icon"
      [class.invalid]="control.touched && control.invalid"
      [class.focused]="control.valid && focused()"
      [attr.data-testid]="testId + '-clear-icon'"
      (mousedown)="onClearControl($event)"
      (tap)="onClearControl($event)">
      <sbi-icon [iconImage]="clearIcon"></sbi-icon>
    </div>

    <div
      class="chevron-icon"
      [class.invalid]="control.touched && control.invalid"
      [class.open]="focused() && !disabledByMaxElems"
      [class.disabled]="control.disabled || disabledByMaxElems"
      [class.focused]="focused()">
      <sbi-icon [iconImage]="chevronIcon"></sbi-icon>
    </div>

    <span *ngIf="suffixIconType === 'custom'">
      <ng-content select="[suffix-icon]"></ng-content>
    </span>
    <div matSuffix class="suffix-content">
      <ng-content select="[suffix-content]"></ng-content>
    </div>
  </div>
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="displayFunc"
    [attr.data-testid]="testId + '-autocomplete'"
    (optionSelected)="onSelectionChange($event)"
    (opened)="onAutoCompleteOpened()">
    <div class="sbi-options">
      <mat-option
        *ngFor="let option of filteredOptions$ | async; trackBy: trackByFn"
        class="sbi-autocomplete-option"
        [disabled]="isDisabledOption(option)"
        [attr.data-testid]="testId + '-option-' + option.viewValue"
        [value]="option.value">
        <sbi-checkbox
          [attr.data-testid]="testId + '-option-' + option.viewValue + '-checkbox'"
          [disabled]="isDisabledOption(option)"
          [checkboxValue]="selection.isSelected(option.value)"
          [label]="option.viewValue"></sbi-checkbox>
      </mat-option>
    </div>
  </mat-autocomplete>
</mat-form-field>

@if (control.invalid && control.touched) {
  <sbi-error [testId]="testId + '-error-message'" [errors]="control.errors" [errorMessages]="errorMessages"></sbi-error>
} @else {
  <div
    *ngIf="subtitle !== undefined"
    class="subtitle"
    [class.disabled]="control.disabled"
    [attr.data-testid]="testId + '-subtitle-message'">
    {{ subtitle }}
  </div>
}
