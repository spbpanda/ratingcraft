<div class="sbi-modal-form-container">
  <div
    sbiResizable
    class="sbi-modal-info-block"
    [ngClass]="{ 'no-scroll': noScroll }"
    [open]="true"
    (opened)="!$event && onClose()"
    [baseSize]="0"
    [maxHeight]="maxHeight"
    [dragTargetClassName]="'sbi-modal-info-block'"
    [activeForOpen]="meIsActive && isMobile"
    [openCloseDelta]="openCloseDelta"
    [attr.data-testid]="testId">
    <div class="icon-wrapper" (click)="onClose()" (tap)="onClose()">
      <sbi-icon [testId]="testId + '-clear-icon'" [iconImage]="closeIcon"></sbi-icon>
    </div>
    <div *ngIf="isMobile" class="drag-wrapper" id="drag-line">
      <div class="drag" id="drag" [attr.data-testid]="testId + '-drag-line'"></div>
    </div>
    <div class="scroll-container">
      <ng-content></ng-content>
    </div>
  </div>
</div>
