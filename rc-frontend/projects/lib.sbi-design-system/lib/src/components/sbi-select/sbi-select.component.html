<mat-form-field appearance="fill" class="sbi-input" [attr.data-testid]="testId" [hideRequiredMarker]="hideRequiredMarker">
  <mat-label *ngIf="label">{{ label }}</mat-label>
  <mat-select
    [compareWith]="compareFn"
    [formControl]="control"
    [placeholder]="placeholder"
    [attr.data-testid]="testId + '-select'"
    (selectionChange)="onSelectionChange($event)"
    (focusin)="onFocusChange(true)"
    (focusout)="onFocusChange(false)">
    <div class="sbi-options">
      <mat-option *ngFor="let option of options;"
        [value]="option.value"
        [disabled]="isDisabledOption(option)"
        [attr.data-testid]="testId + '-option-' + option.viewValue">
        {{ option.viewValue }}
      </mat-option>
    </div>
  </mat-select>
  <div class="icon-container" matSuffix>
    <div class="chevron-icon" [class.invalid]="control.touched && control.invalid" [class.open]="focused()" [class.disabled]="control.disabled">
      <sbi-icon [iconImage]="chevronIcon"></sbi-icon>
    </div>
  </div>
  <div matSuffix class="suffix-content">
    <ng-content select="[suffix-content]"></ng-content>
  </div>
</mat-form-field>

@if(control.invalid && control.touched) {
  <sbi-error
    [testId]="testId + '-error-message'"
    [errors]="control.errors"
    [errorMessages]="errorMessages"></sbi-error>
} @else {
  <div
    *ngIf="subtitle !== undefined"
    class="subtitle"
    [class.disabled]="control.disabled"
    [attr.data-testid]="testId + '-subtitle-message'">{{subtitle}}</div>
}
