<div class="sbi-checkbox-wrapper" [attr.data-testid]="testId">
  <div class="sbi-checkbox-content">
    <input
      *ngIf="control"
      [attr.data-testid]="testId + '-checkbox'"
      class="sbi-checkbox"
      type="checkbox"
      [formControl]="control"
      (change)="onCheckboxValueChanged()" />
    <div
      class="sbi-checkbox-label"
      [ngClass]="{ link: isLink, invalid: control.invalid && control.dirty, disabled: control.disabled }"
      (click)="onClickToLink()"
      [attr.data-testid]="testId + '-check-box-label'">
      @if (label || note) {
      <div *ngIf="label" class="label">{{ label }}</div>
      <div *ngIf="note" class="note">{{ note }}</div>
      } @else {
      <ng-content></ng-content>
      }
    </div>
  </div>
  @if (control.invalid && control.dirty && showErrors) {
  <sbi-error [testId]="testId + '-error-message'" [errors]="control.errors" [errorMessages]="errorMessages"></sbi-error>
  }
</div>
