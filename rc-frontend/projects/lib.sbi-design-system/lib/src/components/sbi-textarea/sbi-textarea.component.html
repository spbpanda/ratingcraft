<div class="textarea-wrapper" [class.disabled]="control.disabled">
    <mat-form-field
        class="sbi-textarea"
        [ngClass]="{ 'sbi-textarea_disabled': readonly }"
        appearance="fill"
    >
        <div class="textarea-container">
            <textarea
                [formControl]="control"
                matInput
                [readonly]="readonly"
                [placeholder]="placeholder"
                [cdkTextareaAutosize]="isAutoResize"
                #autosize="cdkTextareaAutosize"
                [cdkAutosizeMinRows]="minRows"
                [cdkAutosizeMaxRows]="maxRows"
                [maxlength]="maxLength"
                [style.height]="!isAutoResize ? height : null"
                [id]="testId"
            >
            </textarea>
            <div class="counter" *ngIf="maxLength">{{control.value?.length || 0}} / {{ maxLength }}</div>
        </div>
    </mat-form-field>

    <div class="subtitle" *ngIf="subtitle">{{ subtitle }}</div>
    <sbi-error *ngIf="control.invalid && control.touched" [errors]="control.errors" [errorMessages]="errorMessages"></sbi-error>

    <!-- <div
        *ngIf="control.value && !control.disabled && suffixIconType === 'clear' && !readonly"
        (click)="clearControl()"
        class="close-icon"
        matSuffix>
    </div> -->
</div>
